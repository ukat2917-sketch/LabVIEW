name: Consolidate RAMScope docs once

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
          fetch-depth: 0

      - name: Build single RAMScope chapter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          branch = 'claude/labview-teststand-automation-docs-fri3r4'
          docs = Path('docs')
          split = docs / '10_RAMScope'
          main_path = docs / '10_RAMScope実装方針.md'
          workflow_path = Path('.github/workflows/consolidate-ramscope-docs-once.yml')

          def read(name: str) -> str:
              path = split / name
              if not path.exists():
                  raise SystemExit(f'Missing source document: {path}')
              return path.read_text(encoding='utf-8')

          def strip_header(text: str) -> str:
              lines = text.splitlines()
              while lines and not lines[0].startswith('#'):
                  lines.pop(0)
              if lines and lines[0].startswith('#'):
                  lines.pop(0)
              while lines and (not lines[0].strip() or lines[0].startswith('>') or lines[0].startswith('**最終') or lines[0].startswith('**監査')):
                  lines.pop(0)
              if lines and lines[0].strip() == '---':
                  lines.pop(0)
              return '\n'.join(lines).strip()

          def shift_headings(text: str, delta: int = 2) -> str:
              out = []
              in_fence = False
              for line in text.splitlines():
                  if line.strip().startswith('```'):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if not in_fence:
                      m = re.match(r'^(#{1,6})\s+(.*)$', line)
                      if m:
                          hashes, title = m.groups()
                          line = '#' * min(6, len(hashes) + delta) + ' ' + title
                  out.append(line)
              return '\n'.join(out)

          def clean_links(text: str) -> str:
              text = re.sub(r'\[[^\]]+\]\(\./(?:10[^)]*|00A[^)]*|00B[^)]*)\.md(?:#[^)]*)?\)', '本章内の該当節', text)
              text = re.sub(r'\[[^\]]+\]\(\.\./(?:10[^)]*|00A[^)]*|00B[^)]*)\.md(?:#[^)]*)?\)', '本章内の該当節', text)
              return text

          def body(name: str, delta: int = 2) -> str:
              return clean_links(shift_headings(strip_header(read(name)), delta))

          rules = r'''# 10. RAMScope GT170 実装・学習ガイド

**最終整理日：2026-07-21**

> 本章をRAMScope実装資料の唯一の正本とする。
>
> 本章は、LabVIEWで初めてVIを組む読者が、画面を再現するだけでなく、各VIの責務、データモデル、アルゴリズム、Case Structure、For Loop、Shift RegisterおよびCLFNを選ぶ理由を説明できる状態を目標とする。
>
> 本章の整理によってVIまたはctlの構成は変更しない。資料に存在しないVIまたはctlを追加しない。

---

## 10.1 本章の記述ルール

各VIは、原則として次の順序で説明する。

```text
0. 実現したい機能とVIの責務
1. 入力データの実体
2. 出力データモデル
3. 前提条件・異常条件
4. 処理アルゴリズム
5. LabVIEW構造の選定理由
6. フロントパネル入出力と接続元・接続先
7. 配置する関数およびSubVI
8. 配線順
9. 単体テスト
```

### 10.1.1 機能要求からLabVIEW構造へ翻訳する

```text
条件で処理を変える
  → 分岐が必要
  → Case Structure

同じ処理を複数要素へ適用する
  → 反復が必要
  → For Loop

前反復の値や累積結果を保持する
  → 状態保持が必要
  → Shift Register

U8配列の一部を読む
  → OffsetとLengthが必要
  → Array Subset

固定位置へ構造体データを書く
  → 書込Indexが必要
  → Replace Array Subset
```

「Caseを置く」「For Loopを置く」から説明を始めず、必要な分岐・反復・状態保持を先に示す。

### 10.1.2 ストラクチャを先に配置する

```text
1. Case Structure、For LoopまたはWhile Loopを配置する。
2. selector、N端子または停止条件を接続する。
3. 作業対象のCaseへ切り替える。
4. そのCaseまたはLoop内へ関数・SubVIを配置する。
5. 全Caseの全出力トンネルを接続する。
```

内部処理を説明したあとで、後付けのようにストラクチャを登場させない。

### 10.1.3 Case名は実際のTrue／Falseを先に書く

```text
Falseケース（Input Valid?=False：入力値不正）
Trueケース（Input Valid?=True：入力値正常）
Falseケース（Connected?=False：DeviceInit未成功）
Trueケース（Connected?=True：DeviceExitが必要）
```

`正常ケース`、`エラーケース`、`不足ケース`だけでは記載しない。selector式と具体的な評価例も直前に示す。

### 10.1.4 新しい関数を突然登場させない

初めて使用する関数またはSubVIは、次を必ず書く。

```text
日本語名（英語名）
配置場所またはQuick Drop名
採用理由
入力端子ごとの接続元
出力端子ごとの接続先
代替案を採用しない理由
```

`CaseまたはMerge Errors相当`のように実装方法を選択式で投げない。本章では採用方式を1つへ固定する。

### 10.1.5 error clusterを端子単位で説明する

ローカルエラー生成では、次をすべて記載する。

```text
Bundle By Nameの基準クラスタ
statusへ接続するBoolean
codeへ接続するI32
sourceの文字列全文
Format Into Stringのプレースホルダ順
Bundle出力を接続するCase出力トンネル
```

### 10.1.6 Caseのバイパス側でも全出力を作る

False側でSubVIを呼ばない場合でも、True側と同じ型の全出力を接続する。

例：Close CaseのFalseケースでは`RAMScope_Close.vi`を呼ばないが、`Error_To_TestStatus.vi`を使って`Status`、`TestError`、`error out`を生成し、Stateは入力をそのまま通す。

### 10.1.7 フロントパネル出力の生成元を明記する

各出力について、次を表で示す。

```text
PoC出力名
接続元となるVI名
接続元端子名
途中Caseを通るか
Caseの両側で何を接続するか
```

制御器と表示器、入力と出力、内部デバッグ表示器と公開出力を混同しない。

### 10.1.8 状態Booleanの更新元を明記する

`Connected?をTrueへ更新する`だけでは不足である。

```text
Connected?
= NOT(RAMScope_Connect.vi.error out.status)

Measurement Started?
= State.Connected? AND NOT(RAMScope_Log_Start.vi.error out.status)
```

状態クラスタの初期値、更新式、Bundle By Nameのクラスタ入力、更新後Stateの接続先まで示す。

### 10.1.9 薄いラッパVIを共通説明だけで省略しない

全Wrapperに次を個別記載する。

```text
Cプロトタイプ
CLFN Parametersの順番
Type / Data Type / Pass
Pointer左端子の初期値
Pointer右端子の出力
配列の事前確保サイズ
Function Name文字列
API ReturnCodeとerror outの接続
True／False両Caseの安全出力
単体テスト
```

---

## 10.2 現行ファイル構成

本章の整理では、次に示す既存ファイルだけを使用する。

### 10.2.1 ctlファイル

| ファイル | 担当 |
|---|---|
| `Status.ctl` | TestStandの継続・中断判定 |
| `TestError.ctl` | 機器名、コード、メッセージ、時刻、致命判定 |
| `RAMScope_Byte_Order.ctl` | Big / Little Endian選択 |
| `RAMScope_Meas_Config.ctl` | MEASINFOへ変換する測定条件 |
| `RAMScope_Channel.ctl` | 1チャンネル分のRAM測定設定 |
| `RAMScope_Module_Log_Config.ctl` | 1モジュール分のログ容量設定 |
| `RAMScope_Module_Info.ctl` | SYSINFO 1レコードの解析結果 |
| `RAMScope_Channel_Value.ctl` | 1チャンネル分の解析値 |
| `RAMScope_Packet.ctl` | 1Packet分のChannel、Flag、Timestamp |
| `RAMScope_PoC_State.ctl` | Connect、Start、Stop、Release等の成功履歴 |

### 10.2.2 共通変換・Builder・Parser VI

```text
RAMScope_Code_To_Error.vi
U8x4_To_U32.vi
U8x4_To_I32.vi
U8x8_To_U64.vi
U32_To_LE_U8x4.vi
I32_To_LE_U8x4.vi
Build_MEASINFO_170_Raw.vi
Build_CHINFO_170_Raw.vi
Build_LOGINFO_Raw.vi
Parse_SYSINFO_Array.vi
RAMScope_Parse_Buffer.vi
```

### 10.2.3 薄いDLLラッパVI

```text
RS_DLL_GT150DeviceInit.vi
RS_DLL_GT150DeviceExit.vi
RS_DLL_GT150AllInit.vi
RS_DLL_GT150GetSysInfo.vi
RS_DLL_GT150PGT_SetMdlConfig.vi
RS_DLL_GT170SetMeasCond.vi
RS_DLL_GT170SetMeasCh.vi
RS_DLL_GT150SetLoggingInfo.vi
RS_DLL_GT150MeasStart.vi
RS_DLL_GT150GetBufferData.vi
RS_DLL_GT150ReleaseBufferData.vi
RS_DLL_GT150MeasStop.vi
```

### 10.2.4 公開API

```text
RAMScope_Connect.vi
RAMScope_Init.vi
RAMScope_Set_Cond.vi
RAMScope_Log_Start.vi
RAMScope_Read.vi
RAMScope_Log_Stop.vi
RAMScope_Release.vi
RAMScope_Close.vi
```

### 10.2.5 PoC・単体操作・TestStand

```text
PoC_RAMScope_Main.vi
```

現時点では`PoC_RAMScope_Main.vi`が、TestStandなしでConnectからCleanupまでを一度通して操作するVIを兼ねる。Standalone専用VIを別名で追加しない。

TestStandは上記8個の公開APIを呼ぶ。資料にないTestStand専用ラッパVIを追加しない。

---

## 10.3 レイヤ構成と責務

```text
TestStand または PoC_RAMScope_Main.vi
  → RAMScope_* 公開API
      → Builder / Parser / Common
          → RS_DLL_* 薄いラッパ
              → CLFN
                  → RAMScopeVP_API_x64.dll
```

| レイヤ | 説明できるべき責務 |
|---|---|
| ctl | VI間で共有するデータの意味と型を固定する |
| Common | API ReturnCode、Endian、数値変換を一元化する |
| Builder | 意味付き設定をDLL用U8配列へ変換する |
| Parser | DLLのU8配列を意味付きクラスタへ変換する |
| 薄いラッパ | C関数1個をCLFNで1回呼ぶ |
| 公開API | 複数の下位VIを1つの機器操作へまとめる |
| PoC | TestStandなしで順序、状態、Cleanupを検証する |
| TestStand | 条件分岐、反復、レポート、全体Cleanupを管理する |
'''

          env = body('10A_RAMScope実装手順_DLL準備とCLFN疎通確認.md', 2)
          env = env.replace('STEP 2：最小`RAMScope_Connect.vi`を作る', 'STEP 2：`RS_DLL_GT150DeviceInit.vi`でCLFN疎通を確認する')
          env = env.replace('最初に作成したDeviceInitの最小VIは、次の名称で保存する。', '現行構成では、DeviceInitのCLFNは薄いラッパとして次の名称で保存する。')
          env = env.replace('RAMScope_Connect.vi', 'RS_DLL_GT150DeviceInit.vi')
          env = env.replace('`RAMScope_Init.vi`は別VIで、`AllInit`と`GetSysInfo`を担当する。', '公開APIの`RAMScope_Connect.vi`は、この薄いラッパを内部から呼ぶ。`RAMScope_Init.vi`はAllInit、GetSysInfo、ParserおよびPGT設定を担当する。')

          confirmed = body('00_00A_00B監査結果と現行補正.md', 2)
          code_error = body('10B1_RAMScope_Code_To_Error_VI作成手順.md', 2)
          wrapper_current = body('02_DLLラッパVI_全12個_CLFN配線手順.md', 2)
          wrapper_detail = body('10B2_RAMScope_DLLラッパVI_CLFN配線手順.md', 2)
          builder_current = body('03_構造体Builder_VI作成手順.md', 2)
          builder_detail = body('10B3_RAMScope_構造体生成VI作成手順.md', 2)
          parser_current = body('04_Parser_VI作成手順.md', 2)
          parser_detail = body('10B4_RAMScope_Parser_VI作成手順.md', 2)
          public_api = body('05_Public_API_8個_監査済み作成手順.md', 2)
          close_detail = body('05A_RAMScope_Close_VI詳細作成手順.md', 2)
          poc_detail = body('06A_PoC_RAMScope_Main_VI詳細作成手順.md', 2)
          output_map = body('06B_PoC_RAMScope_Main_出力配線対応表.md', 2)

          logging_teststand_raw = read('06_PoC_ロギング_TestStand.md')
          start = logging_teststand_raw.find('## 2. RAMScope側ロギングとLabVIEW側ファイル保存')
          if start < 0:
              raise SystemExit('Could not locate logging/TestStand section')
          logging_teststand = clean_links(shift_headings(logging_teststand_raw[start:], 2))

          sections = [
              rules,
              '\n---\n\n## 10.4 環境準備・DLL疎通確認\n\n' + env,
              '\n---\n\n## 10.5 確定仕様・エラーコード・監査結果\n\n' + confirmed,
              '\n---\n\n## 10.6 ctlファイル・共通データモデル\n\n' + builder_current,
              '\n---\n\n## 10.7 `RAMScope_Code_To_Error.vi`\n\n' + code_error,
              '\n---\n\n## 10.8 薄いDLLラッパVI 12個\n\n### 10.8.1 現行補正と一覧\n\n' + wrapper_current + '\n\n### 10.8.2 各Wrapperの省略しない作成手順\n\n' + wrapper_detail,
              '\n---\n\n## 10.9 数値変換・構造体Builder\n\n### 10.9.1 現行仕様とアルゴリズム\n\n' + builder_current + '\n\n### 10.9.2 各VIの作成手順\n\n' + builder_detail,
              '\n---\n\n## 10.10 Parser\n\n### 10.10.1 データモデルと構造選定\n\n' + parser_current + '\n\n### 10.10.2 各VIの作成手順\n\n' + parser_detail,
              '\n---\n\n## 10.11 公開API 8個\n\n' + public_api + '\n\n### 10.11.9 `RAMScope_Close.vi`補足詳細\n\n' + close_detail,
              '\n---\n\n## 10.12 `PoC_RAMScope_Main.vi`とTestStandなしの単体操作\n\n' + poc_detail + '\n\n### 10.12.1 全フロントパネル出力の生成元\n\n' + output_map,
              '\n---\n\n## 10.13 ロギング・TestStand組込み・Cleanup\n\n' + logging_teststand,
              '\n---\n\n## 10.14 実装完了時の説明チェック\n\n' + r'''
各VIについて、作成者は次を他者へ説明できること。

- なぜVIを分離したか。
- 入力データが何を表すか。
- 出力クラスタまたは配列が何を表すか。
- どの前提条件をCase Structureで守っているか。
- For Loopの1反復が何を表すか。
- Shift Registerが何を保持するか。
- Offset、Packet Size、Buffer Sizeの式がどこから導かれたか。
- フロントパネル各出力が、どのSubVIのどの端子から出ているか。
- 正常系、境界系、異常系でどのCaseへ進むか。
- 前段エラーとCleanupエラーのどちらを優先するか。

本章を見ても接続元、接続先、型、Case、出力トンネルが判断できない記述を見つけた場合、VIを推測で組まず、本章を先に修正する。
'''
          ]

          main = '\n'.join(s.rstrip() for s in sections).rstrip() + '\n'
          main_path.write_text(main, encoding='utf-8')

          def append_rule(path: Path, marker: str, addition: str):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n---\n\n' + marker + '\n' + addition.strip() + '\n', encoding='utf-8')

          append_rule(
              docs / '00A_LabVIEW実装資料の記述ルール.md',
              '<!-- RAMSCOPE_FEEDBACK_RULES_20260721 -->',
              r'''
## 指摘事項から追加した必須ルール

1. Case Structureの両側で、全出力トンネルの接続元を記載する。
2. SubVIを呼ばないCaseでも、Status、TestError、error out等の代替生成方法を記載する。
3. `CaseまたはMerge Errors相当`のような選択式表現を禁止し、採用関数を1つへ固定する。
4. 初登場の関数は目的、配置、全入力、全出力、採用理由を記載する。
5. 状態Booleanは、更新元VI、端子、論理式、Bundle By Nameの接続を記載する。
6. 各トップVIのフロントパネル出力について、元VI名と元端子名の対応表を作る。
7. 制御器／表示器、入力／出力、内部デバッグ／公開端子を明記する。
8. 薄いDLL Wrapperは共通テンプレートだけで個別手順を省略しない。
9. Builder出力をWrapper入力へ渡す方向を明記し、Raw配列をWrapper出力と誤記しない。
10. 資料整理を理由に、既存資料にないVIまたはctlを追加しない。
'''
          )

          append_rule(
              docs / '00B_LabVIEW学習型VI設計ルール.md',
              '<!-- RAMSCOPE_OUTPUT_SOURCE_RULES_20260721 -->',
              r'''
## トップVIの出力ソースを説明する

トップVIでは、出力一覧だけでなく次を示す。

```text
出力名
  → 元となるSubVI
  → 元端子
  → 分岐位置
  → Caseを通る場合のTrue側接続
  → Caseを通る場合のFalse側接続
  → 最終表示器またはコネクタペーン
```

状態管理では、Boolean名だけでなく更新式を擬似コードで示す。Cleanupでは、通常処理の最初のエラーを保持しながらStop、Release、Closeを試す理由を説明する。
'''
          )

          # Split documents are removed only after the single chapter is written.
          if split.exists():
              for p in sorted(split.rglob('*'), reverse=True):
                  if p.is_file():
                      p.unlink()
                  elif p.is_dir():
                      p.rmdir()
              split.rmdir()

          # Repair links from top-level documents to the removed split pages.
          for path in [Path('README.md'), *docs.glob('*.md')]:
              if not path.exists() or path == main_path:
                  continue
              text = path.read_text(encoding='utf-8')
              old = text
              if path.name == 'README.md':
                  replacement = '(docs/10_RAMScope実装方針.md)'
                  text = re.sub(r'\(docs/10_RAMScope/[^)]+\.md(?:#[^)]+)?\)', replacement, text)
              else:
                  replacement = '(./10_RAMScope実装方針.md)'
                  text = re.sub(r'\(\./10_RAMScope/[^)]+\.md(?:#[^)]+)?\)', replacement, text)
                  text = re.sub(r'\(10_RAMScope/[^)]+\.md(?:#[^)]+)?\)', replacement, text)
              if text != old:
                  path.write_text(text, encoding='utf-8')

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit consolidated chapter
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RAMScope資料を第10章の単一学習型ガイドへ再統合'
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
