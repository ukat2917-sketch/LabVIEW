name: Extract chapter 10 structure

on:
  push:
    branches:
      - chatgpt/unify-ramscope-chapter10-build-flow

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/unify-ramscope-chapter10-build-flow
          fetch-depth: 0
      - run: python scripts/extract_ch10_structure.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ch10-structure.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "第10章の見出し構造を抽出"
          git push origin HEAD:chatgpt/unify-ramscope-chapter10-build-flow
