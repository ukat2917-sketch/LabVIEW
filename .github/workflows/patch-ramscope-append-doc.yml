name: Patch RAMScope append documentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/ramscope-append-doc.trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.base.ref == 'claude/labview-teststand-automation-docs-fri3r4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
          fetch-depth: 0

      - name: Apply append documentation patch
        run: python scripts/patch-ramscope-append-doc.py

      - name: Verify insertion and preserved summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/10_RAMScope実装方針.md')
          t = p.read_text(encoding='utf-8')
          required = [
              '### 10.12.4 `RAMScope_File_Log_Append.vi`',
              '<!-- ramscope-append-detail-start -->',
              '<!-- ramscope-append-detail-end -->',
              'RAMScope_File_Log_Append.vi: Packet count does not match DataNum.',
              '`Log Trigger`',
              'Channel_001_001',
              'Written Packet Count=`DataNum`',
              '### 10.12.5 `RAMScope_File_Log_Close.vi`',
          ]
          missing = [s for s in required if s not in t]
          if missing:
              raise SystemExit(f'missing required content: {missing}')
          if t.count('<!-- ramscope-append-detail-start -->') != 1:
              raise SystemExit('append detail start marker count is not 1')
          print('verification passed')
          PY

      - name: Commit documentation
        run: |
          if git diff --quiet -- docs/10_RAMScope実装方針.md; then
            echo 'No documentation changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/10_RAMScope実装方針.md
          git commit -m 'docs: detail RAMScope TDMS append implementation'
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
