name: Run insertion-only RAMScope documentation merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - claude/labview-teststand-automation-docs-fri3r4

permissions:
  contents: write

jobs:
  merge-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
          fetch-depth: 0

      - name: Run insertion-only merge
        run: python scripts/merge-ramscope-docs-preserve-original.py

      - name: Verify original sections and merged markers
        run: |
          set -euo pipefail
          grep -q '## 10.4 環境準備・DLL疎通確認' docs/10_RAMScope実装方針.md
          grep -q '## 10.8 薄いDLLラッパVI 18個' docs/10_RAMScope実装方針.md
          grep -q '## 10.12 LabVIEW側TDMS保存VI' docs/10_RAMScope実装方針.md
          grep -q 'ramscope-read-detail-merged-start' docs/10_RAMScope実装方針.md
          grep -q 'ramscope-poc-read-wiring-merged-start' docs/10_RAMScope実装方針.md
          test ! -f docs/10R_RAMScope_Read_vi_作成手順.md
          git diff --check

      - name: Commit canonical merged document
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          git commit -m 'docs: merge RAMScope Read details without deleting chapter text'
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
