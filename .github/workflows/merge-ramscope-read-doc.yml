# One-time documentation migration. This file deletes itself after success.
name: Consolidate RAMScope Read documentation

on:
  push:
    branches:
      - claude/labview-teststand-automation-docs-fri3r4
    paths:
      - .github/workflows/merge-ramscope-read-doc.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
          fetch-depth: 0

      - name: Merge Read guide into chapter 10
        shell: python
        run: |
          from pathlib import Path
          import re

          main_path = Path("docs/10_RAMScope実装方針.md")
          detail_path = Path("docs/10R_RAMScope_Read_vi_作成手順.md")
          readme_path = Path("README.md")

          main = main_path.read_text(encoding="utf-8")
          detail = detail_path.read_text(encoding="utf-8")
          readme = readme_path.read_text(encoding="utf-8")

          detail_start = "## 0. 実現したい機能とVIの責務"
          if detail_start not in detail:
              raise RuntimeError("10R detail start marker was not found")

          detail_body = detail[detail.index(detail_start):].rstrip()
          converted = []
          for line in detail_body.splitlines():
              if line.startswith("#### "):
                  converted.append(f"**{line[5:]}**")
              elif line.startswith("### "):
                  converted.append("###### " + line[4:])
              elif line.startswith("## "):
                  converted.append("##### " + line[3:])
              else:
                  converted.append(line)
          detail_body = "\n".join(converted)

          new_read_section = """#### 5. `RAMScope_Read.vi`（GetBufferDataNum対応の最終仕様・詳細作成手順）

<!-- generated-vi-diagram -->
![RAMScopeRead.vi 入出力イメージ](./assets/vi-diagrams/ramscoperead.svg)

> 旧構造の`ChNum × RequestedDataNum Limit`から先にBufferサイズを算出する方式は使用しない。
> 本節を`RAMScope_Read.vi`の端子、Case Structure、数値型、エラー文字列および配線順の正本とする。

""" + detail_body

          pattern = re.compile(
              r"#### `RAMScope_Read\.vi`（GetBufferDataNum対応の最終仕様）.*?(?=\n---\n\n#### 6\. `RAMScope_Release\.vi`)",
              re.DOTALL,
          )
          main, count = pattern.subn(new_read_section, main, count=1)
          if count != 1:
              raise RuntimeError(f"RAMScope_Read.vi section replacement count was {count}")

          main = main.replace("**最終整理日：2026-07-26**", "**最終整理日：2026-08-05**", 1)
          main = main.replace("%lld", "%d")

          row_165 = "| `-700165` | `RAMScope_Read.vi` | Parsed Packet CountとDataNumが不一致 |\n"
          row_166 = "| `-700166` | `RAMScope_Read.vi` | ChNum、RequestedDataNum Limit、MdlNoまたはMax Buffer Bytesが不正 |\n"
          if row_166 not in main:
              if row_165 not in main:
                  raise RuntimeError("-700165 error table row was not found")
              main = main.replace(row_165, row_165 + row_166, 1)

          old_inputs = """入力：
  Byte Order
  Meas Config
  Channel List
  Module Log Configs
  MaxDataNum
  Wait Time
  error in

出力：
  UnitNum
  kind
  Module List
  MdlNo_RAM
  MdlNo_CAN
  Endian_RAM
  Raw Buffer
  DataNum
  LostDataNum
  Packets
"""
          new_inputs = """入力：
  Byte Order
  Meas Config
  Channel List
  Module Log Configs
  RequestedDataNum Limit I32
  Max Buffer Bytes I64
  Wait Time
  error in

出力：
  UnitNum
  kind
  Module List
  MdlNo_RAM
  MdlNo_CAN
  Endian_RAM
  AvailableDataNum
  RequestedDataNum
  Raw Buffer
  DataNum
  LostDataNum
  Packets
"""
          if old_inputs not in main:
              raise RuntimeError("PoC main input/output block was not found")
          main = main.replace(old_inputs, new_inputs, 1)

          old_read_steps = """10. シーケンス右側のerror wireを`RAMScope_Read.vi / error in`へ接続する。
11. `RAMScope_Read.vi / Raw Buffer`、`DataNum`、`LostDataNum`、`Packets`を、それぞれ同名のPoC表示器へ直接接続する。
12. `State After Start`は変更せず、通常Log Stop後の状態更新位置まで右方向へ引く。
"""
          new_read_steps = """10. シーケンス右側のerror wireを`RAMScope_Read.vi / error in`へ接続する。
11. フロントパネルの旧`MaxDataNum`制御器を`RequestedDataNum Limit`へ改名し、表現形式をI32にする。この値は1回のReadで要求するPacket数の上限であり、Byte数ではない。
12. `RAMScope_Read.vi / Max Buffer Bytes`端子を右クリックし、`作成 → 制御器`でI64数値制御器を作る。ラベルは`Max Buffer Bytes`とし、0より大きい値を設定する。PoC初期値の例は`268435456`byte（256MiB）とするが、実験PCのメモリ制約に合わせて変更してよい。
13. `RequestedDataNum Limit` I32制御器を`RAMScope_Read.vi / RequestedDataNum Limit`へ接続する。
14. `Max Buffer Bytes` I64制御器を`RAMScope_Read.vi / Max Buffer Bytes`へ接続する。`RequestedDataNum Limit`、`Buffer Byte Size`、`Max Buffer Bytes`を同じ端子へ流用しない。
15. `Channel List`、`Byte Order`、`UnitNo`、`MdlNo_RAM`がRead VIの同名端子へ接続されていることを確認する。
16. `RAMScope_Read.vi / AvailableDataNum`と`RequestedDataNum`からI32表示器を作り、GetBufferDataNumの取得可能数と実要求数をPoC上で確認できるようにする。
17. `RAMScope_Read.vi / Raw Buffer`、`DataNum`、`LostDataNum`、`Packets`を、それぞれ同名のPoC表示器へ直接接続する。
18. `State After Start`は変更せず、通常Log Stop後の状態更新位置まで右方向へ引く。

##### F.1 Read入力の役割を混同しない

```text
RequestedDataNum Limit I32
  = 1回に要求するPacket数の上限

Max Buffer Bytes I64
  = Read VIが1回に確保してよいRaw BufferのByte上限

Required Bytes I64
  = Read VI内部でRequestedDataNumとPacket Sizeから計算する値
```

`Max Buffer Bytes`は`GetBufferDataNum.vi`へ接続しない。`RAMScope_Read.vi`内部のRequired Bytes上限判定にだけ使用する。

##### F.2 Read端子の配線見取り図

```text
PoC RequestedDataNum Limit I32 ─→ RAMScope_Read.vi / RequestedDataNum Limit
PoC Max Buffer Bytes I64 ───────→ RAMScope_Read.vi / Max Buffer Bytes
PoC Channel List ───────────────→ RAMScope_Read.vi / Channel List
PoC Byte Order ─────────────────→ RAMScope_Read.vi / Byte Order
PoC UnitNo I32 ─────────────────→ RAMScope_Read.vi / UnitNo
Init.MdlNo_RAM I32 ─────────────→ RAMScope_Read.vi / MdlNo

RAMScope_Read.vi / AvailableDataNum ─→ PoC AvailableDataNum
RAMScope_Read.vi / RequestedDataNum ─→ PoC RequestedDataNum
RAMScope_Read.vi / Raw Buffer ────────→ PoC Raw Buffer
RAMScope_Read.vi / DataNum ───────────→ PoC DataNum
RAMScope_Read.vi / LostDataNum ───────→ PoC LostDataNum
RAMScope_Read.vi / Packets ───────────→ PoC Packets
```
"""
          if old_read_steps not in main:
              raise RuntimeError("PoC Read wiring steps were not found")
          main = main.replace(old_read_steps, new_read_steps, 1)

          table_anchor = "| `Endian_RAM` | `RAMScope_Init.vi / Endian_RAM` | Init出力から直接接続 | 0=Big、1=Littleのコード |\n"
          table_rows = (
              "| `AvailableDataNum` | `RAMScope_Read.vi / AvailableDataNum` | Read出力から直接接続 | GetBufferDataNumが返した取得可能Packet数 |\n"
              "| `RequestedDataNum` | `RAMScope_Read.vi / RequestedDataNum` | Read出力から直接接続 | Limit適用後にGetBufferDataへ要求したPacket数 |\n"
          )
          if table_rows not in main:
              if table_anchor not in main:
                  raise RuntimeError("PoC output table anchor was not found")
              main = main.replace(table_anchor, table_anchor + table_rows, 1)

          old_read_outputs = """`RAMScope_Read.vi`の右側へ、次の4表示器を配置する。

```text
RAMScope_Read.vi
├─ Raw Buffer ─────→ Raw Buffer表示器
├─ DataNum ────────→ DataNum表示器
├─ LostDataNum ────→ LostDataNum表示器
└─ Packets ────────→ Packets表示器
```

##### 配線順

1. `RAMScope_Read.vi / Raw Buffer`をU8一次元配列表示器へ接続する。
2. `DataNum`をI32表示器へ接続する。
3. `LostDataNum`をI32表示器へ接続する。
4. `Packets`を`RAMScope_Packet.ctl[]`表示器へ接続する。
5. これらのワイヤをStop、Release、Cleanup、Close Caseへ通さない。
"""
          new_read_outputs = """`RAMScope_Read.vi`の右側へ、次の6表示器を配置する。

```text
RAMScope_Read.vi
├─ AvailableDataNum ─→ AvailableDataNum表示器
├─ RequestedDataNum ─→ RequestedDataNum表示器
├─ Raw Buffer ───────→ Raw Buffer表示器
├─ DataNum ──────────→ DataNum表示器
├─ LostDataNum ──────→ LostDataNum表示器
└─ Packets ──────────→ Packets表示器
```

##### 配線順

1. `RAMScope_Read.vi / AvailableDataNum`をI32表示器へ接続する。
2. `RequestedDataNum`をI32表示器へ接続する。
3. `Raw Buffer`をU8一次元配列表示器へ接続する。
4. `DataNum`をI32表示器へ接続する。
5. `LostDataNum`をI32表示器へ接続する。
6. `Packets`を`RAMScope_Packet.ctl[]`表示器へ接続する。
7. これらのワイヤをStop、Release、Cleanup、Close Caseへ通さない。
8. `AvailableDataNum`、`RequestedDataNum`、`DataNum`の関係を次で確認する。

```text
0 <= DataNum <= RequestedDataNum <= RequestedDataNum Limit
RequestedDataNum <= AvailableDataNum
```
"""
          if old_read_outputs not in main:
              raise RuntimeError("PoC Read output section was not found")
          main = main.replace(old_read_outputs, new_read_outputs, 1)

          diagram_anchor = "RAMScope_Read.vi\n├─ Raw Buffer ──────────────────────────→ PoC Raw Buffer\n"
          diagram_replacement = "RAMScope_Read.vi\n├─ AvailableDataNum ────────────────────→ PoC AvailableDataNum\n├─ RequestedDataNum ────────────────────→ PoC RequestedDataNum\n├─ Raw Buffer ──────────────────────────→ PoC Raw Buffer\n"
          if diagram_anchor not in main:
              raise RuntimeError("PoC completion diagram anchor was not found")
          main = main.replace(diagram_anchor, diagram_replacement, 1)

          checklist_anchor = "- [ ] Raw Buffer、DataNum、LostDataNum、PacketsはRead出力へ直接接続されている。\n"
          checklist_replacement = (
              "- [ ] `RequestedDataNum Limit` I32がRead VIの同名端子へ接続されている。\n"
              "- [ ] `Max Buffer Bytes` I64がRead VIの同名端子へ接続され、0より大きい。\n"
              "- [ ] AvailableDataNum、RequestedDataNum、Raw Buffer、DataNum、LostDataNum、PacketsはRead出力へ直接接続されている。\n"
          )
          if checklist_anchor not in main:
              raise RuntimeError("PoC checklist Read row was not found")
          main = main.replace(checklist_anchor, checklist_replacement, 1)

          readme = readme.replace(
              "> RAMScopeの環境準備、DLLラッパ、構造体生成、Parser、公開API、PoCは[10_RAMScope実装方針.md](./docs/10_RAMScope実装方針.md)を上位正本とし、`RAMScope_Read.vi`の端子・Case・配線単位の詳細は[10R_RAMScope_Read_vi_作成手順.md](./docs/10R_RAMScope_Read_vi_作成手順.md)を使用する。",
              "> RAMScopeの環境準備、DLLラッパ、構造体生成、Parser、公開API、PoCは[10_RAMScope実装方針.md](./docs/10_RAMScope実装方針.md)を唯一の正本とする。",
          )
          readme = readme.replace("  ├─ 10R RAMScope_Read.vi詳細作成手順\n", "  ├─ RAMScope_Read.vi詳細作成手順\n")
          readme = readme.replace(
              "RAMScope実装では旧`10A`、`10B`、`10B-1`から`10B-4`を参照しない。第10章を上位正本とし、`RAMScope_Read.vi`の詳細作業だけは子文書`10R`を併用する。",
              "RAMScope実装では旧`10A`、`10B`、`10B-1`から`10B-4`および子文書`10R`を参照しない。第10章だけを正本として使用する。",
          )
          readme = re.sub(r"^\| 10R \|.*\n", "", readme, flags=re.MULTILINE)

          main_path.write_text(main, encoding="utf-8")
          readme_path.write_text(readme, encoding="utf-8")

          detail_path.unlink()
          Path(".github/workflows/merge-ramscope-read-doc.yml").unlink()

      - name: Validate consolidation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/10R_RAMScope_Read_vi_作成手順.md
          test ! -e .github/workflows/merge-ramscope-read-doc.yml
          grep -Fq '#### 5. `RAMScope_Read.vi`（GetBufferDataNum対応の最終仕様・詳細作成手順）' docs/10_RAMScope実装方針.md
          grep -Fq 'Max Buffer Bytes I64' docs/10_RAMScope実装方針.md
          grep -Fq 'PoC Max Buffer Bytes I64' docs/10_RAMScope実装方針.md
          grep -Fq '`-700166`' docs/10_RAMScope実装方針.md
          ! grep -Fq '%lld' docs/10_RAMScope実装方針.md
          ! grep -Fq '10R_RAMScope_Read_vi_作成手順.md' README.md

      - name: Commit consolidated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/10_RAMScope実装方針.md docs/10R_RAMScope_Read_vi_作成手順.md .github/workflows/merge-ramscope-read-doc.yml
          git commit -m "docs: consolidate RAMScope Read guide into chapter 10"
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
