name: Add RAMScope flag semantics

on:
  push:
    branches:
      - chatgpt/integrate-ramscope-logging-chapter10

permissions:
  contents: write

jobs:
  update-document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/integrate-ramscope-logging-chapter10
          fetch-depth: 0

      - name: Update flag semantics
        run: python scripts/add_ramscope_flag_semantics.py

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "RAMモニタFlagの値定義を追記"
          git push origin HEAD:chatgpt/integrate-ramscope-logging-chapter10
