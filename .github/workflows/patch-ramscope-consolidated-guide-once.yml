name: Patch consolidated RAMScope guide once

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/.trigger-ramscope-guide-patch'

permissions:
  contents: write

jobs:
  patch-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
          fetch-depth: 0

      - name: Patch consolidated guide
        run: python3 scripts/patch_ramscope_consolidated_guide_once.py

      - name: Commit patched guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '統合後のRAMScope第10章から旧手順と曖昧表現を除去'
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
