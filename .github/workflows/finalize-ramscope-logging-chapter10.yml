name: Finalize RAMScope chapter 10 logging integration

on:
  push:
    branches:
      - chatgpt/integrate-ramscope-logging-chapter10

permissions:
  contents: write

jobs:
  finalize-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/integrate-ramscope-logging-chapter10
          fetch-depth: 0

      - name: Finalize chapter update
        run: python scripts/finalize_ramscope_logging_chapter10.py

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "TDMS保存順序と公開API記述を最終調整"
          git push origin HEAD:chatgpt/integrate-ramscope-logging-chapter10
