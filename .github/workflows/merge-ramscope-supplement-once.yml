## 5. 2026-07-17追加ルール

### 5.1 既存本文を維持して追記する

既存資料へ新しい確定情報を反映する場合、利用者が実装中の既存手順を不用意に失わないようにする。

```text
1. 既存本文を削除・置換しない
2. 章末へ日付付き追記節を作る
3. 既存記述と競合する場合は、追記節を優先すると明記する
4. 旧記述は変更履歴として維持する
5. 最終統合時に内容を削る場合は、利用者の確認を得る
```

### 5.2 Case StructureはTrue／Falseを先に書く

`正常ケース`、`不正ケース`、`Raw不足ケース`等の意味名だけで記載してはならない。

```text
Falseケース（Input Valid?=False：入力値不正）
Trueケース（Input Valid?=True：入力値正常）
Falseケース（Raw Buffer Sufficient?=False：Raw Buffer不足）
Trueケース（Raw Buffer Sufficient?=True：Raw Buffer十分）
Trueケース（DataNum == 0：空配列を返す）
Falseケース（DataNum != 0：解析する）
```

Case Structureを説明する直前に、selectorの式と評価例を記載する。

```text
selector = Actual Byte Count >= Expected Byte Count
20 >= 20 → True
したがってTrueケース（Raw Buffer十分）へ進む。
```

### 5.3 ストラクチャを先に配置する

内部処理を説明する前に、入れ物となるCase Structure、ForループまたはWhileループを配置する。

```text
1. ストラクチャを配置する
2. selector、N端子または停止条件を配線する
3. 作業対象のTrue／Falseケースへ切り替える
4. そのケース内へ関数およびSubVIを配置する
5. 内側ストラクチャが必要なら、先に内側ストラクチャを配置する
6. 内部処理を作る
7. 全ケースの出力トンネルを配線する
```

各節の冒頭に作業領域を住所形式で記載する。

```text
作業領域：
外側error Case Structure
  → Falseケース（既存エラーなし）
    → Input Valid? Case Structure
      → Trueケース（入力値正常）
        → Raw Buffer Sufficient? Case Structure
          → Falseケース（Raw Buffer不足）
```

### 5.4 文字列は全文と入力順を書く

文字列定数、文字列にフォーマット（Format Into String）および文字列連結（Concatenate Strings）を使用する場合、実際に入力する全文を記載する。

次を省略してはならない。

1. Format String全文。
2. 改行位置。
3. `%d`、`%s`、`%X`等の個数と順番。
4. 各プレースホルダへ接続する値と型。
5. 生成文字列の接続先。
6. 単体テスト時の期待source。

### 5.5 error cluster生成を端子単位で書く

ローカルエラーを返す場合、`code=-700130を返す`だけで終わらせない。

```text
基準クラスタ ← 対象Caseへ入ってきた正常なerror cluster
status       ← Boolean True
code         ← I32エラーコード
source       ← Format Into String出力
```

名前でバンドル（Bundle By Name）の出力先となるCase Structureのerror出力トンネルまで記載する。

