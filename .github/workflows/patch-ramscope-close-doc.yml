name: Patch RAMScope close documentation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.base.ref == 'claude/labview-teststand-automation-docs-fri3r4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/labview-teststand-automation-docs-fri3r4
      - name: Patch chapter 10
        run: python scripts/patch-ramscope-close-doc.py
      - name: Verify insertion
        run: |
          grep -q 'ramscope-close-detail-start' docs/10_RAMScope実装方針.md
          grep -q 'TDMS Close.*error in.*True' docs/10_RAMScope実装方針.md || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/10_RAMScope実装方針.md
          git commit -m 'docs: detail RAMScope TDMS close cleanup implementation'
          git push origin HEAD:claude/labview-teststand-automation-docs-fri3r4
