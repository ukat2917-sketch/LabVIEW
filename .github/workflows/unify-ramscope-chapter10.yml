name: Unify RAMScope chapter 10 build flow

on:
  push:
    branches:
      - chatgpt/unify-ramscope-chapter10-build-flow
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - claude/labview-teststand-automation-docs-fri3r4

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/unify-ramscope-chapter10-build-flow
          fetch-depth: 0
      - name: Unify chapter 10
        run: python scripts/unify_ramscope_chapter10.py
      - name: Commit unified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "第10章の作成手順を一本化"
          git push origin HEAD:chatgpt/unify-ramscope-chapter10-build-flow
