name: Fix chapter 10 heading hierarchy

on:
  push:
    branches:
      - chatgpt/unify-ramscope-chapter10-build-flow

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/unify-ramscope-chapter10-build-flow
          fetch-depth: 0
      - run: python scripts/fix_ch10_heading_hierarchy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "第10章一本化後の見出し階層を修正"
          git push origin HEAD:chatgpt/unify-ramscope-chapter10-build-flow
